<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Login to Crunk Games - Your ultimate gaming platform">
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <title>Crunk Games - Login</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated Background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(52, 211, 153, 0.05);
            animation: float 20s infinite;
        }

        .circle-1 {
            width: 500px;
            height: 500px;
            top: -250px;
            right: -100px;
            animation-delay: 0s;
        }

        .circle-2 {
            width: 400px;
            height: 400px;
            bottom: -200px;
            left: -100px;
            animation-delay: 5s;
        }

        .circle-3 {
            width: 300px;
            height: 300px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: 10s;
        }

        .circle-4 {
            width: 200px;
            height: 200px;
            bottom: 100px;
            right: 100px;
            animation-delay: 15s;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            25% {
                transform: translate(50px, 50px) scale(1.1);
            }
            50% {
                transform: translate(0, 100px) scale(1);
            }
            75% {
                transform: translate(-50px, 50px) scale(0.9);
            }
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 1;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 40px 30px;
            width: 100%;
            max-width: 450px;
            border: 1px solid rgba(52, 211, 153, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeInUp 0.6s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Logo Section */
        .logo-container {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            font-size: 60px;
            color: #34d399;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .logo-container h1 {
            font-size: 32px;
            font-weight: 800;
            margin-top: 10px;
            background: linear-gradient(135deg, #fff, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tagline {
            color: #9ca3af;
            font-size: 14px;
            margin-top: 5px;
        }

        /* Form Controls */
        .form-control {
            position: relative;
            margin-bottom: 25px;
        }

        .form-control input,
        .country-code {
            width: 100%;
            padding: 15px 45px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #1f2937;
            border-radius: 15px;
            color: #fff;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-control input:focus,
        .country-code:focus {
            outline: none;
            border-color: #34d399;
            box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.2);
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            font-size: 18px;
            transition: all 0.3s ease;
        }

        .form-control input:focus + .input-icon {
            color: #34d399;
        }

        .form-control label {
            position: absolute;
            left: 45px;
            top: 15px;
            color: #9ca3af;
            font-size: 16px;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .form-control input:focus ~ label,
        .form-control input:valid ~ label {
            transform: translateY(-30px) translateX(-30px);
            font-size: 12px;
            color: #34d399;
            background: #0f172a;
            padding: 0 8px;
        }

        /* Phone Input Group */
        .phone-input-group {
            display: flex;
            gap: 10px;
        }

        .country-code {
            width: 120px;
            padding: 15px 30px 15px 15px;
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2334d399'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 20px;
        }

        .phone-input-wrapper {
            flex: 1;
            position: relative;
        }

        /* Error Messages */
        .error-message {
            color: #ef4444;
            font-size: 12px;
            margin-top: 5px;
            display: none;
            padding-left: 10px;
        }

        /* Buttons */
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #34d399, #2bb078);
            border: none;
            border-radius: 15px;
            color: #0f0f0f;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(52, 211, 153, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-loader {
            width: 20px;
            height: 20px;
            border: 2px solid #0f0f0f;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Message Display */
        .message {
            text-align: center;
            margin-top: 15px;
            padding: 10px;
            border-radius: 10px;
            font-size: 14px;
            display: none;
        }

        .message.success {
            display: block;
            background: rgba(52, 211, 153, 0.1);
            color: #34d399;
            border: 1px solid #34d399;
        }

        .message.error {
            display: block;
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid #ef4444;
        }

        .message.info {
            display: block;
            background: rgba(59, 130, 246, 0.1);
            color: #3b82f6;
            border: 1px solid #3b82f6;
        }

        /* Divider */
        .divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
        }

        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: calc(50% - 80px);
            height: 1px;
            background: #1f2937;
        }

        .divider::before {
            left: 0;
        }

        .divider::after {
            right: 0;
        }

        .divider span {
            background: #0f172a;
            padding: 0 15px;
            color: #9ca3af;
            font-size: 13px;
        }

        /* Google Button */
        .google-login-wrapper {
            margin: 15px 0;
        }

        .google-btn {
            width: 100%;
            padding: 12px;
            background: #fff;
            border: none;
            border-radius: 15px;
            font-size: 16px;
            font-weight: 500;
            color: #444;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s ease;
        }

        .google-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        .google-btn img {
            width: 22px;
            height: 22px;
        }

        /* Alternative Login */
        .alt-login {
            margin-top: 15px;
        }

        .btn-phone {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid #1f2937;
            border-radius: 15px;
            color: #fff;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .btn-phone:hover {
            border-color: #34d399;
            color: #34d399;
            background: rgba(52, 211, 153, 0.1);
        }

        /* Footer Links */
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #1f2937;
        }

        .footer-links a {
            color: #9ca3af;
            text-decoration: none;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .footer-links a:hover {
            color: #34d399;
        }

        /* Loading Overlay */
        .loader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            backdrop-filter: blur(5px);
        }

        .loader-overlay.active {
            display: flex;
        }

        .loader-dots {
            display: flex;
            gap: 10px;
        }

        .loader-dots span {
            width: 12px;
            height: 12px;
            background: #34d399;
            border-radius: 50%;
            animation: pulse 1s infinite;
        }

        .loader-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loader-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes pulse {
            0%, 80%, 100% {
                transform: scale(0);
                opacity: 0.3;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .loader-overlay p {
            margin-top: 15px;
            color: #34d399;
            font-weight: 500;
        }

        /* Toast Container */
        .toast-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10001;
        }

        .toast {
            background: #34d399;
            color: #0f0f0f;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 14px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 5px 20px rgba(52, 211, 153, 0.3);
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            align-items: center;
            justify-content: center;
            z-index: 20000;
            backdrop-filter: blur(5px);
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #0f172a;
            padding: 30px;
            border-radius: 20px;
            max-width: 400px;
            width: 90%;
            border: 1px solid #1f2937;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-content h2 {
            color: #34d399;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .modal-content p {
            color: #9ca3af;
            margin-bottom: 20px;
        }

        .close-modal {
            float: right;
            font-size: 28px;
            cursor: pointer;
            color: #9ca3af;
            transition: all 0.3s ease;
        }

        .close-modal:hover {
            color: #ef4444;
            transform: rotate(90deg);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }

            .logo-container h1 {
                font-size: 28px;
            }

            .phone-input-group {
                flex-direction: column;
            }

            .country-code {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="bg-animation">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
        <div class="circle circle-3"></div>
        <div class="circle circle-4"></div>
    </div>

    <div class="container">
        <!-- Logo / Brand -->
        <div class="logo-container">
            <i class="fas fa-gamepad logo-icon"></i>
            <h1>Crunk Games</h1>
            <p class="tagline">Your Ultimate Gaming Destination</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm">
            <!-- Username Field -->
            <div class="form-control">
                <input type="text" id="username" required autocomplete="off">
                <i class="fas fa-user input-icon"></i>
                <label>Username</label>
                <span id="usernameError" class="error-message"></span>
            </div>

            <!-- Email Field -->
            <div class="form-control">
                <input type="email" id="email" required autocomplete="off">
                <i class="fas fa-envelope input-icon"></i>
                <label>Email</label>
                <span id="emailError" class="error-message"></span>
            </div>

            <!-- Phone Number with Country Code -->
            <div class="form-control">
                <div class="phone-input-group">
                    <select id="countryCode" class="country-code" required>
                        <option value="" disabled selected>🌍 Select Code</option>
                    </select>
                    <div class="phone-input-wrapper">
                        <input type="tel" id="phone" required autocomplete="off">
                        <i class="fas fa-phone input-icon"></i>
                    </div>
                </div>
                <span id="phoneError" class="error-message"></span>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-primary">
                <i class="fas fa-sign-in-alt"></i>
                <span>Login / Register</span>
                <div class="btn-loader" style="display: none;"></div>
            </button>

            <!-- Message Display -->
            <div id="message" class="message"></div>
        </form>

        <!-- Divider -->
        <div class="divider">
            <span>Or continue with</span>
        </div>

        <!-- Google Login Button -->
        <div class="google-login-wrapper">
            <button class="google-btn" id="googleLoginBtn">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                Continue with Google
            </button>
        </div>

        <!-- Alternative Login Options -->
        <div class="alt-login">
            <button class="btn-phone" id="phoneLoginBtn">
                <i class="fas fa-mobile-alt"></i>
                <span>Phone Login</span>
            </button>
        </div>

        <!-- Footer -->
        <div class="footer-links">
            <a href="#">Terms of Service</a>
            <a href="#">Privacy Policy</a>
            <a href="#">Help</a>
        </div>
    </div>

    <!-- Phone Login Modal -->
    <div id="phoneModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closePhoneModal()">&times;</span>
            <h2><i class="fas fa-mobile-alt"></i> Phone Login</h2>
            <p>Enter your phone number to receive a verification code</p>
            <div class="form-control">
                <div class="phone-input-group">
                    <select id="modalCountryCode" class="country-code"></select>
                    <input type="tel" id="modalPhone" placeholder="Phone number">
                </div>
            </div>
            <button class="btn-primary" onclick="sendOTP()">
                <i class="fas fa-paper-plane"></i> Send OTP
            </button>
            <div id="otpSection" style="display: none; margin-top: 15px;">
                <input type="text" id="otpCode" placeholder="Enter 6-digit OTP" style="width: 100%; padding: 12px; border-radius: 10px; background: #1f2937; border: none; color: white; margin-bottom: 10px;">
                <button class="btn-primary" onclick="verifyOTP()">Verify</button>
            </div>
        </div>
    </div>

    <!-- Loader -->
    <div id="loader" class="loader-overlay">
        <div>
            <div class="loader-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <p>Loading...</p>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Scripts -->
    <script type="module">
        // ================= SESSION CHECK =================
        const savedUser = localStorage.getItem("crunkUser");
        if (savedUser) {
            window.location.href = "home.html";
        }

        // ================= LABEL ANIMATION =================
        window.addEventListener('load', () => {
            const container = document.querySelector('.container');
            if (container) container.style.opacity = 1;

            const labels = document.querySelectorAll('.form-control label');
            labels.forEach(label => {
                label.innerHTML = label.innerText
                    .split('')
                    .map((letter, idx) => `<span style="transition-delay:${idx * 30}ms">${letter}</span>`)
                    .join('');
            });
        });

        // ================= FIREBASE MODULAR SETUP =================
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { 
            getAuth, 
            GoogleAuthProvider, 
            signInWithPopup,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            setDoc, 
            getDoc,
            collection,
            query,
            where,
            getDocs 
        } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        // ================= FIREBASE CONFIG =================
        const firebaseConfig = {
            apiKey: "AIzaSyBW0Sz7TODfa8tQJTfNUaLhfK9qJhdA1yE",
            authDomain: "crunck-app.firebaseapp.com",
            projectId: "crunck-app",
            storageBucket: "crunck-app.firebasestorage.app",
            messagingSenderId: "475953302982",
            appId: "1:475953302982:web:607e08379adb12f985f6c7",
            measurementId: "G-7ZQ20HK4SD"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const googleProvider = new GoogleAuthProvider();

        googleProvider.setCustomParameters({
            prompt: 'select_account'
        });

        // ================= COUNTRY CODES =================
        const countryCodes = [
            { code: "+1", country: "USA/Canada" }, { code: "+44", country: "UK" },
            { code: "+91", country: "India" }, { code: "+61", country: "Australia" },
            { code: "+86", country: "China" }, { code: "+81", country: "Japan" },
            { code: "+49", country: "Germany" }, { code: "+33", country: "France" },
            { code: "+39", country: "Italy" }, { code: "+34", country: "Spain" },
            { code: "+55", country: "Brazil" }, { code: "+7", country: "Russia" },
            { code: "+82", country: "South Korea" }, { code: "+52", country: "Mexico" },
            { code: "+27", country: "South Africa" }, { code: "+20", country: "Egypt" },
            { code: "+234", country: "Nigeria" }, { code: "+254", country: "Kenya" },
            { code: "+971", country: "UAE" }, { code: "+966", country: "Saudi Arabia" },
            { code: "+90", country: "Turkey" }, { code: "+31", country: "Netherlands" },
            { code: "+46", country: "Sweden" }, { code: "+41", country: "Switzerland" },
            { code: "+64", country: "New Zealand" }, { code: "+62", country: "Indonesia" },
            { code: "+63", country: "Philippines" }, { code: "+66", country: "Thailand" },
            { code: "+84", country: "Vietnam" }, { code: "+60", country: "Malaysia" },
            { code: "+65", country: "Singapore" }, { code: "+358", country: "Finland" },
            { code: "+47", country: "Norway" }, { code: "+45", country: "Denmark" },
            { code: "+48", country: "Poland" }, { code: "+351", country: "Portugal" },
            { code: "+30", country: "Greece" }, { code: "+420", country: "Czech Republic" },
            { code: "+36", country: "Hungary" }, { code: "+353", country: "Ireland" }
        ];

        // Populate country codes
        function populateCountryCodes() {
            const select = document.getElementById("countryCode");
            const modalSelect = document.getElementById("modalCountryCode");
            if (!select) return;
            
            countryCodes.forEach(c => {
                const option = document.createElement("option");
                option.value = c.code;
                option.textContent = `${c.country} (${c.code})`;
                select.appendChild(option);
                if (modalSelect) {
                    const modalOption = document.createElement("option");
                    modalOption.value = c.code;
                    modalOption.textContent = `${c.country} (${c.code})`;
                    modalSelect.appendChild(modalOption);
                }
            });
        }

        document.addEventListener('DOMContentLoaded', populateCountryCodes);

        // ================= HELPER FUNCTIONS =================
        function showMessage(text, type = "info") {
            const msgDiv = document.getElementById("message");
            if (!msgDiv) return;
            
            msgDiv.textContent = text;
            msgDiv.className = `message ${type}`;
            
            if (type === "success") {
                setTimeout(() => {
                    msgDiv.className = "message";
                    msgDiv.textContent = "";
                }, 3000);
            }
        }

        function showLoader(show) {
            const loader = document.getElementById("loader");
            if (loader) {
                loader.classList.toggle("active", show);
            }
        }

        function showToast(message, type = "info") {
            const container = document.getElementById("toastContainer");
            if (!container) return;
            
            const toast = document.createElement("div");
            toast.className = "toast";
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'}"></i> ${message}`;
            container.appendChild(toast);
            
            setTimeout(() => toast.classList.add("show"), 100);
            setTimeout(() => {
                toast.classList.remove("show");
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // ================= FORM LOGIN =================
        const form = document.getElementById("loginForm");
        
        if (form) {
            form.addEventListener("submit", async (e) => {
                e.preventDefault();

                const username = document.getElementById("username")?.value.trim();
                const email = document.getElementById("email")?.value.trim();
                const countryCode = document.getElementById("countryCode")?.value || "+1";
                const phoneNumber = document.getElementById("phone")?.value.trim();

                if (!username || !email || !phoneNumber) {
                    showMessage("Please fill all fields.", "error");
                    return;
                }

                if (username.length < 3) {
                    showMessage("Username must be at least 3 characters.", "error");
                    return;
                }
                if (!/^\S+@\S+\.\S+$/.test(email)) {
                    showMessage("Enter a valid email address.", "error");
                    return;
                }
                if (!/^\d{7,15}$/.test(phoneNumber)) {
                    showMessage("Enter a valid phone number (7-15 digits).", "error");
                    return;
                }

                try {
                    showLoader(true);
                    
                    // Check if user exists
                    const usersRef = collection(db, "users");
                    const q = query(usersRef, where("email", "==", email));
                    const querySnapshot = await getDocs(q);
                    
                    const userId = "user_" + Date.now() + "_" + Math.random().toString(36).substr(2, 9);
                    const userData = {
                        uid: userId,
                        username: username,
                        displayName: username,
                        email: email,
                        phone: countryCode + phoneNumber,
                        photoURL: null,
                        loginMethod: "form",
                        createdAt: new Date().toISOString(),
                        status: 'online',
                        userId: userId
                    };
                    
                    await setDoc(doc(db, "users", userId), userData);
                    localStorage.setItem("crunkUser", JSON.stringify(userData));
                    
                    showMessage("Login successful! Redirecting...", "success");
                    setTimeout(() => {
                        window.location.href = "home.html";
                    }, 1000);
                    
                } catch (err) {
                    console.error("Login error:", err);
                    showMessage("Error processing login. Please try again.", "error");
                } finally {
                    showLoader(false);
                }
            });
        }

        // ================= GOOGLE LOGIN =================
        window.handleGoogleLogin = async function() {
            try {
                showLoader(true);
                const result = await signInWithPopup(auth, googleProvider);
                const user = result.user;
                
                const userDocRef = doc(db, "users", user.uid);
                const userDoc = await getDoc(userDocRef);
                
                let userData;
                if (userDoc.exists()) {
                    userData = userDoc.data();
                } else {
                    userData = {
                        uid: user.uid,
                        username: user.displayName,
                        displayName: user.displayName,
                        email: user.email,
                        photoURL: user.photoURL,
                        loginMethod: "google",
                        createdAt: new Date().toISOString(),
                        status: 'online',
                        userId: user.uid
                    };
                    await setDoc(userDocRef, userData);
                }
                
                localStorage.setItem("crunkUser", JSON.stringify(userData));
                showToast("Login successful!", "success");
                window.location.href = "home.html";
                
            } catch (error) {
                console.error("Google login error:", error);
                showMessage("Google login failed: " + error.message, "error");
            } finally {
                showLoader(false);
            }
        };

        document.getElementById("googleLoginBtn")?.addEventListener("click", window.handleGoogleLogin);

        // ================= PHONE LOGIN =================
        window.showPhoneLogin = function() {
            document.getElementById("phoneModal")?.classList.add("active");
        };
        
        window.closePhoneModal = function() {
            document.getElementById("phoneModal")?.classList.remove("active");
        };
        
        window.sendOTP = function() {
            showToast("Phone login coming soon!", "info");
        };
        
        window.verifyOTP = function() {
            showToast("OTP verification coming soon!", "info");
        };
        
        document.getElementById("phoneLoginBtn")?.addEventListener("click", window.showPhoneLogin);
        
        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById("phoneModal");
            if (event.target === modal) {
                modal.classList.remove("active");
            }
        };

        // ================= VALIDATION =================
        const usernameInput = document.getElementById("username");
        if (usernameInput) {
            usernameInput.addEventListener("input", (e) => {
                const value = e.target.value;
                const errorSpan = document.getElementById("usernameError");
                if (errorSpan && value.length > 0) {
                    if (value.length < 3) {
                        errorSpan.textContent = "Username too short";
                        errorSpan.style.display = "block";
                    } else if (!/^[a-zA-Z0-9_]+$/.test(value)) {
                        errorSpan.textContent = "Only letters, numbers, _";
                        errorSpan.style.display = "block";
                    } else {
                        errorSpan.style.display = "none";
                    }
                }
            });
        }

        const emailInput = document.getElementById("email");
        if (emailInput) {
            emailInput.addEventListener("input", (e) => {
                const value = e.target.value;
                const errorSpan = document.getElementById("emailError");
                if (errorSpan && value.length > 0) {
                    if (!/^\S+@\S+\.\S+$/.test(value)) {
                        errorSpan.textContent = "Invalid email format";
                        errorSpan.style.display = "block";
                    } else {
                        errorSpan.style.display = "none";
                    }
                }
            });
        }

        const phoneInput = document.getElementById("phone");
        if (phoneInput) {
            phoneInput.addEventListener("input", (e) => {
                const value = e.target.value;
                const errorSpan = document.getElementById("phoneError");
                if (errorSpan && value.length > 0) {
                    if (!/^\d+$/.test(value)) {
                        errorSpan.textContent = "Only numbers allowed";
                        errorSpan.style.display = "block";
                    } else if (value.length < 7 || value.length > 15) {
                        errorSpan.textContent = "Phone must be 7-15 digits";
                        errorSpan.style.display = "block";
                    } else {
                        errorSpan.style.display = "none";
                    }
                }
            });
        }

        console.log("✅ Login page ready!");
    </script>
</body>
</html>
